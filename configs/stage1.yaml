# PHASE 1 — Classical CV pipeline 설정
# 실험할 때는 코드 대신 이 파일의 값을 바꾸고, 변경 이유를 docs/experiments.md에 기록한다.

input_dir: data/raw
output_dir: results
seed: 42          # k-means 등 무작위 요소를 재현 가능하게 고정

resize:
  max_side: 768   # 긴 변 기준 최대 크기(px). 이보다 작은 이미지는 확대하지 않는다.

color:
  k: 5                # 대표색 개수
  sample_size: 20000  # k-means에 사용할 무작위 픽셀 수
  method: lab          # 유채색 판정 기준: hsv | lab  (EXP-003)
  sat_threshold: 40    # [hsv] S(0~255) 미만 → 무채색
  chroma_threshold: 15 # [lab] chroma 미만 → 무채색. 10/15/20 비교 후 확정 (EXP-003)
  dark_threshold: 50   # V(0~255) 미만 → 어두운 픽셀, Hue 히스토그램에서 제외

edge:
  blur_ksize: 5           # Canny 전 Gaussian blur 커널 크기 (홀수). cv2.Canny는 blur를 하지 않는다.
  method: fixed           # contour/패널에 사용할 방식: fixed | auto  (EXP-004)
  fixed_low: 100          # [fixed] hysteresis 하한 — baseline
  fixed_high: 200         # [fixed] hysteresis 상한 — baseline
  auto_sigma: 0.33        # [auto] threshold = (1 ± sigma) × 밝기 median
  min_contour_length: 50  # 이보다 짧은 contour(px)는 노이즈로 보고 제외

silhouette:
  method: grabcut          # 이후 단계에서 사용할 mask: otsu | grabcut  (EXP-005)
  morph_ksize: 7           # closing/opening 커널 크기 (두 방법 공통 후처리)
  otsu_blur_ksize: 5       # [otsu] threshold 전 Gaussian blur
  grabcut_margin_x: 0.05   # [grabcut] 초기 사각형의 좌우 여백 (이미지 너비 대비). 바깥은 확실한 배경
  grabcut_margin_y: 0.02   # [grabcut] 초기 사각형의 상하 여백 (이미지 높이 대비)
  grabcut_iterations: 5    # [grabcut] 반복 횟수
  grabcut_scale: 0.33      # [grabcut] 계산 해상도 배율. x0.5와 IoU 차이 없음, 3배 빠름 (EXP-005)

texture:
  window: 7         # local std 창 크기(px). mask도 이 크기로 erode해서 실루엣 경계를 제외한다
  std_scale: 64     # 시각화 고정 스케일 (이미지 간 비교 가능하도록 이미지별 정규화를 하지 않음)
  lap_scale: 64

material_map:
  canvas: [1080, 1350]   # 4:5 에디토리얼 비율
  cell: 8                # 점 하나가 대표하는 칸 크기(px, 원본 기준)
  std_scale: 40          # 점 크기 스케일: local std 40 이상이면 최대 크기
  show_edges: true
  font: C:/Windows/Fonts/bahnschrift.ttf
  font_mono: C:/Windows/Fonts/consola.ttf
  footer: "grabcut x0.33 · chroma T15 · cell 8px · texture 7px"
