# PHASE 1 — Classical CV pipeline 설정
# 실험할 때는 코드 대신 이 파일의 값을 바꾸고, 변경 이유를 docs/experiments.md에 기록한다.

input_dir: data/raw
output_dir: results
seed: 42          # k-means 등 무작위 요소를 재현 가능하게 고정

resize:
  max_side: 768   # 긴 변 기준 최대 크기(px). 이보다 작은 이미지는 확대하지 않는다.

color:
  k: 5                # 대표색 개수
  sample_size: 20000  # k-means에 사용할 무작위 픽셀 수
  method: lab          # 유채색 판정 기준: hsv | lab  (EXP-003)
  sat_threshold: 40    # [hsv] S(0~255) 미만 → 무채색
  chroma_threshold: 15 # [lab] chroma 미만 → 무채색. 10/15/20 비교 후 확정 (EXP-003)
  dark_threshold: 50   # V(0~255) 미만 → 어두운 픽셀, Hue 히스토그램에서 제외
